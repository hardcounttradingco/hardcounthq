<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hard Count HQ</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <!-- HERO -->
    <section class="hero">
      <img class="logo" src="images/logo.png" alt="Hard Count Trading Co. logo" />

      <p class="eyebrow">HARD COUNT HQ</p>
      <h1>LIVE THE HOBBY.</h1>
      <p class="subline">Cards, collector merch, and tools built for the hobby.</p>
    </section>

    <!-- CARD GRID -->
    <section class="card-grid">
      <a class="hq-card" href="https://www.ebay.com/str/hardcounttradingco" target="_blank">
        <div class="card-visual">
    <img src="images/collect.png" alt="Collect">
</div>
        <div class="card-copy">
          <h2>COLLECT</h2>
          <p>Browse Inventory</p>
        </div>
      </a>

      <a class="hq-card" href="https://hardcounttradingco.etsy.com" target="_blank">
        <div class="card-visual">
    <img src="images/wear.png" alt="Gear">
</div>
        <div class="card-copy">
          <h2>GEAR</h2>
          <p>Collector Gear</p>
        </div>
      </a>

      <a class="hq-card" href="https://www.instagram.com/hardcounttradingco" target="_blank">
        <div class="card-visual">
    <img src="images/follow.png" alt="Follow">
</div>
        <div class="card-copy">
          <h2>FOLLOW</h2>
          <p>Behind the Scenes</p>
        </div>
      </a>

      <div class="hq-card disabled">
        <div class="card-visual">
    <img src="images/run.png" alt="Run">
</div>
        <div class="card-copy">
          <h2>RUN</h2>
          <p>Coming Soon</p>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer>
      Hard Count Trading Co. · Built for collectors.
    </footer>
  </main>
</body>
</html>
